# Pipeline de logs da EZBikes
# API (logstash-logback-encoder, JSON por linha) --TCP 50000--> Logstash --> Elasticsearch (app-logs-AAAA.MM.DD)

input {
  tcp {
    port  => 50000
    codec => json_lines
  }
}

filter {
  # Remove metadados que só ocupam espaço. O [event][original] guarda a linha bruta
  # recebida (inclusive qualquer dado pessoal que escapasse do mascaramento).
  mutate {
    remove_field => ["@version", "[event][original]"]
  }

  # Segunda camada de proteção de PII (LGPD): mascara qualquer e-mail que tenha
  # chegado em texto claro na mensagem. A primeira camada é o PiiMasker na aplicação.
  mutate {
    gsub => [
      "message", "([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\.[A-Za-z]{2,})", "\1***@\2"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
