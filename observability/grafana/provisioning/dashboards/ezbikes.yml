apiVersion: 1

# Dashboards versionados em observability/grafana/dashboards (JSON), carregados na pasta "EZBikes".
providers:
  - name: ezbikes
    folder: EZBikes
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
