# Alertas de SLO como código (Prometheus), espelho das regras do Grafana Alerting.
#
# O Grafana Alerting é quem notifica (observability/grafana/provisioning/alerting).
# Estas regras ficam no Prometheus para: (1) serem testadas com `promtool test rules`
# (alerts_test.yml) e (2) aparecerem em http://localhost:9090/alerts como segunda visão.
#
# Multi-window, multi-burn-rate (Google SRE Workbook, cap. 5):
#   - a janela LONGA garante que o consumo é relevante (evita alarme por pico de segundos);
#   - a janela CURTA confirma que o problema ainda está acontecendo, e faz o alerta
#     se resolver poucos minutos depois da correção.
#
#   Severidade  Burn rate  Janela longa  Janela curta  Budget consumido na janela longa
#   crítico     14,4x      1h            5m            2%
#   alto        6x         6h            30m           5%
#
# Volume mínimo: os alertas de burn rate exigem pelo menos 10 requisições na janela curta.
# Com pouco tráfego, uma única falha vira uma proporção enorme (1 erro em 2 pedidos = 50%,
# burn rate de 500x) sem representar perda real para os clientes. Isso foi observado no
# experimento de 23/11 (docs/evidencias/experimento-caos.md) e está coberto em alerts_test.yml.
groups:
  - name: ezbikes-slo-alerts
    rules:
      - alert: CheckoutErrorBudgetBurnCritical
        expr: >-
          ezbikes:checkout_burn_rate:rate1h > 14.4 and ezbikes:checkout_burn_rate:rate5m > 14.4
          and ezbikes:checkout_requests:rate5m * 300 >= 10
        for: 1m
        labels:
          severity: critical
          slo: checkout-availability
          service: ezbikes-api
        annotations:
          summary: Checkout consumindo o error budget 14,4x mais rápido que o permitido
          description: Burn rate acima de 14,4x na última hora e nos últimos 5 minutos. Nesse ritmo, 2% do budget mensal some a cada hora.
          runbook: Ver falhas no Kibana (event.action:"order.payment_failed") e o painel do gateway. Política - congelar deploys e considerar rollback.

      - alert: CheckoutErrorBudgetBurnHigh
        expr: >-
          ezbikes:checkout_burn_rate:rate6h > 6 and ezbikes:checkout_burn_rate:rate30m > 6
          and ezbikes:checkout_requests:rate30m * 1800 >= 10
        for: 5m
        labels:
          severity: warning
          slo: checkout-availability
          service: ezbikes-api
        annotations:
          summary: Checkout consumindo o error budget 6x mais rápido que o permitido
          description: Burn rate acima de 6x nas últimas 6 horas e nos últimos 30 minutos (5% do budget em 6 horas).
          runbook: Abrir chamado para o time no horário comercial e investigar a tendência no dashboard de SLO.

      - alert: CatalogLatencyBudgetBurnCritical
        expr: >-
          ezbikes:catalog_latency_burn_rate:rate1h > 14.4 and ezbikes:catalog_latency_burn_rate:rate5m > 14.4
          and ezbikes:catalog_requests:rate5m * 300 >= 10
        for: 1m
        labels:
          severity: critical
          slo: catalog-latency
          service: ezbikes-api
        annotations:
          summary: Catálogo lento consumindo o error budget de latência 14,4x mais rápido
          description: Mais de 14,4% das requisições ao catálogo acima de 300 ms na última hora e nos últimos 5 minutos.
          runbook: Ver saturação (pool de conexões, threads, CPU) no dashboard Golden Signals.

      - alert: CatalogLatencyP99High
        expr: ezbikes:http_latency_seconds:p99_5m{uri=~"/api/products.*"} > 0.5
        for: 5m
        labels:
          severity: warning
          slo: catalog-latency
          service: ezbikes-api
        annotations:
          summary: p99 do catálogo acima de 500 ms
          description: O percentil 99 de uma rota do catálogo passou de 500 ms por 5 minutos.
          runbook: Ver saturação no dashboard Golden Signals e logs lentos no Kibana (http.duration_ms > 500).
