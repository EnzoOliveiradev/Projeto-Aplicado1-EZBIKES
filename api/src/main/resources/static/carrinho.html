<html lang="pt-BR">
<head>

  <meta name="description" content="EZBikes: loja de bicicletas de demonstração (Projeto Aplicado I).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%231f6feb' stroke-width='5' stroke-linecap='round'%3E%3Ccircle cx='14' cy='42' r='10'/%3E%3Ccircle cx='50' cy='42' r='10'/%3E%3Cpath d='M14 42l10-18h16l10 18'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="cart">
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="42" r="10"/><circle cx="50" cy="42" r="10"/><path d="M14 42l10-18h16l10 18M24 24l8 18h-18M40 24l-4-8h-6M32 42l8-18"/></svg>
      EZBikes
    </a>
    <nav class="nav" aria-label="Principal">
      <a href="index.html">Catálogo</a>
      <a href="carrinho.html" aria-current="page">Carrinho <span class="badge" data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>
<main>
  <div class="container">
    <h1>Carrinho</h1>
    <p class="subtitle">Revise os itens e informe seus dados para finalizar.</p>
    <div id="status" aria-live="polite"></div>
    <div class="layout-2">
      <section id="cart" class="panel" aria-live="polite"><p class="empty">Carregando…</p></section>
      <section class="panel">
        <h2>Finalizar compra</h2>
        <form id="checkout" class="form">
          <label>Nome
            <input name="name" autocomplete="name" required maxlength="120">
          </label>
          <label>E-mail
            <input name="email" type="email" autocomplete="email" required maxlength="160">
          </label>
          <p class="muted">Pagamento simulado: nenhum valor é cobrado.</p>
          <button class="btn" type="submit" disabled>Finalizar compra</button>
        </form>
      </section>
    </div>
  </div>
</main>
<footer class="site-footer">
  <div class="container">Loja de demonstração do Projeto Aplicado I · pagamento simulado, nenhum valor é cobrado.</div>
</footer>
</body>
</html>
